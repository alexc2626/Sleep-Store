<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Driftwell Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Figtree:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/assets/store.css">
<style>
  .admin{max-width:1180px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-left,0px));display:grid;gap:24px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
  .stat b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
  .stat span{color:var(--muted);font-size:.85rem}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .bar select,.bar button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit}
  .bar button.primary{background:var(--ink);color:var(--bg)}
  .tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
  table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:900px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  td.num{font-variant-numeric:tabular-nums}
  .pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;background:var(--line)}
  .pill.paid{background:#f7dcb4;color:#1d2342}
  .pill.sent_to_supplier{background:#c9c3f0;color:#1d2342}
  .pill.shipped{background:#bfe6cf;color:#14462d}
  .pill.refunded,.pill.cancelled{background:#f3c7c7;color:#5a1515}
  td a{color:var(--dusk)}
  td button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 10px;font:inherit;font-size:.82rem;margin:2px 0}
  .small{font-size:.8rem;color:var(--muted)}
  #login{max-width:380px}
</style>
</head>
<body>
<div class="admin">
  <h1 style="font-family:var(--display);font-weight:400;font-size:2.4rem">Driftwell admin</h1>
  <form id="login" class="panel">
    <div class="field"><label for="pw">Admin password</label><input id="pw" type="password" required autocomplete="current-password"></div>
    <button class="btn btn-glow" type="submit">Sign in</button>
    <p class="err" id="loginErr" hidden></p>
  </form>
  <div id="app" hidden>
    <div class="stats" id="stats"></div>
    <div class="bar" style="margin-top:20px">
      <label for="filter">Show</label>
      <select id="filter">
        <option value="">All paid orders</option>
        <option value="paid">To ship</option>
        <option value="sent_to_supplier">With supplier</option>
        <option value="shipped">Shipped</option>
        <option value="refunded">Refunded</option>
      </select>
      <button id="refresh">Refresh</button>
      <button id="sync" class="primary">Check CJ for tracking</button>
      <button id="exportSubs">Copy subscriber emails</button>
      <span id="msg" class="small"></span>
    </div>
    <div class="tablewrap" style="margin-top:12px">
      <table>
        <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Supplier</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>
<script type="module" src="/assets/admin.js"></script>
</body>
</html>
